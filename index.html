<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>1.0</title>
<style>
  :root{
    --wood:#8b5a2b; --wood2:#5d3b1a; --ink:#2c2418; --muted:#6d5c45; --gold:#ddc796; --panel:#fffaf0;
    --accent:#2f7a3e; --b:#d5c7a5; --shadow:#b79f6e; --danger:#a32a2a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; overflow:hidden; background:#cfc29d; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}
  #game{position:fixed; inset:0}
  #scene3d{position:absolute; inset:0;}
  /* HUD */
  #hudTop{position:absolute; left:0; right:0; top:0; min-height:64px; display:flex; align-items:center; gap:10px; padding:8px 12px;
    background:linear-gradient(180deg, rgba(255,250,240,.95), rgba(255,250,240,.75)); border-bottom:3px solid var(--wood);
    box-shadow:0 8px 0 0 var(--shadow); z-index:10; flex-wrap:wrap}
  .brand{font-weight:900; letter-spacing:.3px; color:var(--wood2); text-shadow:0 1px #fff}
  .rowflex{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .res{display:flex; gap:8px; flex-wrap:wrap; margin-left:8px}
  .pill{display:flex; gap:6px; align-items:center; background:#fffaf0cc; border:1px solid var(--b); padding:6px 10px; border-radius:12px; box-shadow:inset 0 -1px #fff,0 1px 0 #e9dfc4; font-weight:800}
  .pill small{color:var(--muted); font-weight:700}
  .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  button{cursor:pointer; border:2px solid #5a3a1c; border-radius:10px; padding:7px 12px; color:#fff; font-weight:900; background:linear-gradient(180deg,#a17b4d,#7a5a32); box-shadow:0 2px 0 #6a4a28}
  button.primary{background:linear-gradient(180deg,#3e8c4b,#2f7a3e); border-color:#20582a; box-shadow:0 2px 0 #20582a}
  button.danger{background:linear-gradient(180deg,#c24242,#a32a2a); border-color:#6b1c1c; box-shadow:0 2px 0 #701818}
  button.ghost{background:#ffffffc9; color:#2f2a20; border-color:#bca77c}
  button:disabled{filter:grayscale(.7) brightness(.9); cursor:not-allowed}
  /* Speed control */
  .speed{display:flex; gap:6px; border:1px solid var(--b); border-radius:12px; padding:3px; background:#fffaf0cc; box-shadow:inset 0 -1px #fff,0 1px 0 #e9dfc4}
  .chip{border:1px solid #bca77c; background:#ffffffd9; color:#2b2419; border-radius:10px; padding:6px 10px; font-weight:900}
  .chip.active{background:linear-gradient(180deg,#3e8c4b,#2f7a3e); color:#fff; border-color:#20582a}
  /* Context panel */
  #panelRight{position:absolute; top:80px; bottom:16px; right:16px; width:560px; background:var(--panel); border:1px solid var(--b);
    border-radius:14px; box-shadow:0 12px 0 0 var(--shadow); display:none; flex-direction:column; overflow:hidden; z-index:9;}
  #panelRight.show{display:flex}
  .head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; background:#f6edd8; border-bottom:1px solid var(--b)}
  .title{font-weight:900}
  .content{flex:1; overflow:auto; padding:10px; background:#fffef8}
  .list{display:grid; gap:10px}
  .card{background:#fffdf6; border:1px solid var(--b); border-radius:12px; padding:10px; box-shadow:inset 0 1px #fff, 0 1px 0 #efe4c8}
  .row{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
  .name{font-weight:900}
  .badge{background:var(--wood); color:#fff; border:1px solid #4d321a; padding:3px 8px; border-radius:999px; font-size:12px}
  .costs{display:flex; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .costs span{background:#f2e7cb; border:1px solid var(--b); border-radius:8px; padding:2px 8px}
  .muted{color:var(--muted); font-size:13px}
  .mini-list{display:grid; gap:8px}
  .mini-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center}
  .mini-title{display:flex; align-items:center; gap:8px}
  .mini-title small{color:var(--muted)}
  /* Toast + tip */
  #toast{position:absolute; right:16px; bottom:18px; background:#2f7a3e; color:#fff; border:2px solid #20582a; border-radius:10px; padding:10px 14px; font-weight:900; box-shadow:0 4px 0 #18441f; display:none; z-index:11}
  #toast.error{background:#a32a2a; border-color:#701818}
  #hover-tip{position:absolute; top:84px; left:20px; background:rgba(255,255,255,.9); border:1px solid var(--b); border-radius:8px; padding:4px 8px; font-size:12px; display:block; pointer-events:none; z-index:8}
  @media (max-width:980px){
    #panelRight{right:8px; left:8px; width:auto}
  }
</style>
</head>
<body>
<div id="game">
  <div id="scene3d"><div id="hover-tip">Clique um prédio</div></div>
  <div id="hudTop">
    <div class="brand">🏰 Village Wars</div>
    <div class="res">
      <div class="pill">Madeira <b id="r-wood">0</b> <small id="p-wood">+0/s</small></div>
      <div class="pill">Argila <b id="r-clay">0</b> <small id="p-clay">+0/s</small></div>
      <div class="pill">Ferro <b id="r-iron">0</b> <small id="p-iron">+0/s</small></div>
      <div class="pill">Comida <b id="r-food">0</b> <small id="p-food">+0/s</small></div>
      <div class="pill">Pop <b id="pop">0/0</b></div>
      <div class="pill">Armazém <b id="store">0</b></div>
    </div>
    <div class="right rowflex">
      <div class="speed" id="speedBar">
        <button class="chip active" data-speed="1">1x</button>
        <button class="chip" data-speed="2">2x</button>
        <button class="chip" data-speed="4">4x</button>
        <button class="chip" data-speed="8">8x</button>
      </div>
      <button id="btn-save" class="ghost">Salvar</button>
      <button id="btn-reset" class="danger">Apagar Save</button>
    </div>
  </div>

  <aside id="panelRight">
    <div class="head">
      <div class="title" id="panelTitle">—</div>
      <div class="row">
        <span class="badge" id="panelInfo"></span>
        <button id="btn-close" class="ghost">Fechar</button>
      </div>
    </div>
    <div class="content"><div id="panelBody" class="list"></div></div>
  </aside>
  <div id="toast"></div>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";
import {OrbitControls} from "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js";

/* ===== Helpers ===== */
const fmt=(n)=>Math.floor(n).toLocaleString('pt-BR');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const deepClone=(o)=>JSON.parse(JSON.stringify(o));
const qs=(s,root=document)=>root.querySelector(s);
function el(tag, html, cls){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function toast(msg,err=false){const t=qs('#toast');t.textContent=msg;t.className=err?'error':'';t.style.display='block';clearTimeout(toast._id);toast._id=setTimeout(()=>t.style.display='none',1500);}
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('Erro: '+(e.message||'ver console'),true)});
const rand=(a,b)=>a+Math.random()*(b-a);

/* ===== Game Data ===== */
let SPEED=1; // 1x 2x 4x 8x
const BUILDINGS={
  hq:{nome:'Edifício Principal (HQ)',max:30,baseCost:{wood:200,clay:200,iron:150,food:0},costMult:2.0,efeito:(lvl)=>({})},
  casas:{nome:'Casas',max:30,baseCost:{wood:120,clay:100,iron:80,food:30},costMult:2.0,efeito:(lvl)=>({popMax: (2*Math.min(lvl,9)) + (4*Math.max(0,Math.min(lvl-9,10))) + (6*Math.max(0,lvl-19)) })},
  quartel:{nome:'Quartel',max:25,baseCost:{wood:140,clay:120,iron:100,food:40},costMult:2.0,efeito:(lvl)=>({atkMul_quartel:0.10*lvl})},
  estabulo:{nome:'Estábulo',max:20,baseCost:{wood:200,clay:160,iron:140,food:60},costMult:2.0,efeito:(lvl)=>({atkMul_estabulo:0.10*lvl})},
  oficina:{nome:'Oficina',max:15,baseCost:{wood:220,clay:220,iron:200,food:60},costMult:2.0,efeito:(lvl)=>({atkMul_oficina:0.10*lvl})},
  ferreiro:{nome:'Ferreiro',max:20,baseCost:{wood:150,clay:120,iron:180,food:60},costMult:2.0,efeito:(lvl)=>({})},
  mercado:{nome:'Mercado',max:25,baseCost:{wood:120,clay:120,iron:120,food:80},costMult:2.0,efeito:(lvl)=>({})},
  bosque:{nome:'Bosque',max:30,baseCost:{wood:60,clay:50,iron:40,food:0},costMult:2.0,producao:'wood'},
  argila:{nome:'Poço de Argila',max:30,baseCost:{wood:50,clay:60,iron:40,food:0},costMult:2.0,producao:'clay'},
  ferro:{nome:'Mina de Ferro',max:30,baseCost:{wood:50,clay:50,iron:60,food:0},costMult:2.0,producao:'iron'},
  fazenda:{nome:'Fazendas',max:30,baseCost:{wood:80,clay:60,iron:60,food:0},costMult:2.0,producao:'food'},
  armazem:{nome:'Armazém',max:30,baseCost:{wood:90,clay:80,iron:80,food:0},costMult:2.0,efeito:(lvl)=>({capacidade:Math.floor(780*Math.pow(1.24,Math.max(0,lvl-1)))})},
  praca:{nome:'Praça de Reuniões',max:30,baseCost:{wood:80,clay:60,iron:40,food:0},costMult:2.0,efeito:(lvl)=>({})},
};
const PROD_BASE_PER_SEC=0.75;
const PROD_FACTOR=Math.pow(80,1/29);
const MAP_RADIUS=150;
const HQ_SCALE=1.35;

const UNITS={
  spear:{nome:'Lanceiro',atk:5,hp:12,pop:1,predio:'quartel',custo:{wood:30,clay:40,iron:20,food:10}},
  sword:{nome:'Espadachim',atk:8,hp:14,pop:1,predio:'quartel',custo:{wood:50,clay:30,iron:30,food:10}},
  knight:{nome:'Cavaleiro',atk:28,hp:30,pop:1,predio:'estabulo',custo:{wood:150,clay:120,iron:180,food:60}},
  ram:{nome:'Aríete',atk:40,hp:30,pop:1,predio:'oficina',custo:{wood:200,clay:150,iron:100,food:40}},
  cata:{nome:'Catapulta',atk:75,hp:25,pop:1,predio:'oficina',custo:{wood:250,clay:200,iron:240,food:80}},
};

/* ===== Estado ===== */
function defaultBuildings(){const b={}; for(const k of Object.keys(BUILDINGS)) b[k]=0; b.hq=1; b.armazem=1; b.fazenda=1; return b;}
const DEFAULT={recursos:{wood:200,clay:200,iron:200,food:120},predios:defaultBuildings(),unidades:{},techs:{},missao:null,log:[],reservPop:0, villagers:[]};
for(const u in UNITS) DEFAULT.unidades[u]=0;
let S=(function(){try{const raw=localStorage.getItem('vw-tw'); if(raw) return {...DEFAULT,...JSON.parse(raw)} }catch(e){} return deepClone(DEFAULT)})();
const save=()=>localStorage.setItem('vw-tw',JSON.stringify(S));

/* ===== Pop & Economia ===== */
const nivel=(id)=>S.predios[id]||0;
function efeitos(){
  const e={popMax:0,capacidade:500};
  for(const [id,def] of Object.entries(BUILDINGS)){
    const lvl=nivel(id);
    if(def.efeito){const add=def.efeito(lvl)||{}; for(const k in add){e[k]=(e[k]||0)+add[k]}}
  }
  e.popMax=Math.max(e.popMax,3);
  e.capacidade=Math.max(e.capacidade,1000);
  return e;
}
const storageCap=()=>efeitos().capacidade;
const popCap=()=>efeitos().popMax;
const podePagar=(c)=>Object.entries(c).every(([k,v])=>(S.recursos[k]||0)>=v);
const pagar=(c)=>{for(const [k,v] of Object.entries(c)){S.recursos[k]-=v}};
const custoPredio=(id)=>{const d=BUILDINGS[id],lvl=nivel(id),c={}; for(const r of ['wood','clay','iron','food']) c[r]=Math.floor((d.baseCost[r]||0)*Math.pow(d.costMult,Math.max(0,lvl))); return c; };
function upgrade(id){
  const d=BUILDINGS[id],lvl=nivel(id);
  if(id!=='hq' && lvl>=S.predios.hq) return toast('Limite do HQ. Aumente o HQ primeiro.',true);
  if(lvl>=d.max) return toast('Nível máximo.',true);
  const c=custoPredio(id);
  if(!podePagar(c)) return toast('Recursos insuficientes.',true);
  pagar(c); S.predios[id]=lvl+1;
  if(id==='casas'){spawnNewVillagers(calcHouseIncrement(lvl+1)-calcHouseIncrement(lvl));}
  updateMesh(id); layoutHousesVisual(); toast((lvl===0?'Construído: ':'Aprimorado: ')+d.nome+' N'+(lvl+1));
  renderTop(); if(CUR===id || CUR==='hq') renderPanel(CUR||id);
}
function calcHouseIncrement(lvl){
  return (2*Math.min(lvl,9)) + (4*Math.max(0,Math.min(lvl-9,10))) + (6*Math.max(0,lvl-19));
}
function prodPerSec(){
  const r={wood:0,clay:0,iron:0,food:0};
  const m={'bosque':'wood','argila':'clay','ferro':'iron','fazenda':'food'};
  for(const [bid,typ] of Object.entries(m)){
    const lvl=nivel(bid); if(lvl>0){ r[typ]+=PROD_BASE_PER_SEC*Math.pow(PROD_FACTOR,lvl-1); }
  }
  for(const k in r) r[k]*=SPEED;
  return r;
}

/* ===== HQ: gestão de construções ===== */
function renderHQManager(box){
  const card=el('div','', 'card');
  card.append(el('div','<div class="name">Gerenciar Construções</div><div class="muted">Aprimore outros prédios diretamente pelo HQ. Respeita o limite do HQ e os recursos.</div>'));
  const mini=el('div','', 'mini-list');
  const ids=Object.keys(BUILDINGS).filter(k=>k!=='hq');
  ids.forEach(id=>{
    const def=BUILDINGS[id], lvl=nivel(id), max=def.max;
    const nextCost=custoPredio(id);
    const title=el('div','', 'mini-row');
    const left=el('div',`<div class="mini-title"><b>${def.nome}</b> <small>Nível ${lvl}/${max}</small></div>`);
    const right=el('div');
    const btn=el('button', lvl>=max?'Máx': (lvl>=S.predios.hq?'Limite HQ': (lvl===0?'Construir':'Aprimorar')), 'primary');
    btn.dataset.up=id;
    if(lvl>=max || lvl>=S.predios.hq || !podePagar(nextCost)) btn.disabled=true;
    right.append(btn);
    title.append(left); title.append(right);
    mini.append(title);
    const costs=el('div','', 'costs');
    costs.append(el('span','Custo:'));
    costs.append(el('span','🪵 '+fmt(nextCost.wood||0)));
    costs.append(el('span','🧱 '+fmt(nextCost.clay||0)));
    costs.append(el('span','⛓️ '+fmt(nextCost.iron||0)));
    costs.append(el('span','🥖 '+fmt(nextCost.food||0)));
    mini.append(costs);
  });
  // botão "Aprimorar tudo"
  const row=el('div','', 'row'); const bAll=el('button','Aprimorar tudo (1 nível)',''); bAll.dataset.upAll='1'; row.append(bAll);
  card.append(mini); card.append(row);
  box.append(card);
}
function upgradeAllOnce(){
  const list=Object.keys(BUILDINGS).filter(k=>k!=='hq').map(id=>({id, cost:custoPredio(id)}));
  list.sort((a,b)=>(a.cost.wood+a.cost.clay+a.cost.iron+a.cost.food)-(b.cost.wood+b.cost.clay+b.cost.iron+b.cost.food));
  let done=0;
  for(const item of list){
    const id=item.id, lvl=nivel(id), def=BUILDINGS[id];
    if(lvl>=def.max) continue;
    if(lvl>=S.predios.hq) continue;
    const c=custoPredio(id);
    if(!podePagar(c)) continue;
    pagar(c); S.predios[id]=lvl+1;
    if(id==='casas'){spawnNewVillagers(calcHouseIncrement(lvl+1)-calcHouseIncrement(lvl));}
    updateMesh(id); layoutHousesVisual();
    done++;
  }
  renderTop(); if(CUR) renderPanel(CUR);
  if(done===0) toast('Nada para aprimorar (recursos/limites).',true); else toast('Aprimorados '+done+' prédios.');
}

/* ===== Unidades usam Aldeões ===== */
function freeVillagers(){return S.villagers.filter(v=>v.role==='worker' && !v.assigned).length}
function pickFreeVillagers(q){const arr=S.villagers.filter(v=>v.role==='worker' && !v.assigned); return arr.slice(0,q);}
function treinar(t,q){
  const u=UNITS[t],p=u.predio;
  if(nivel(p)<1) return toast('Requer '+BUILDINGS[p].nome+' N1',true);
  q=Math.max(0,Math.floor(q)); if(q<=0) return;
  if(S.villagers.length+0 > popCap()) return toast('Capacidade de população atingida (Casas).',true);
  if(freeVillagers()<q) return toast('Aldeões livres insuficientes.',true);
  const total={wood:u.custo.wood*q,clay:u.custo.clay*q,iron:u.custo.iron*q,food:u.custo.food*q};
  if(!podePagar(total)) return toast('Recursos insuficientes.',true);
  pagar(total);
  const chosen=pickFreeVillagers(q);
  chosen.forEach(v=>{setVillagerRole(v, t)});
  S.unidades[t]+=q;
  toast('Treinados '+q+' '+u.nome+(q>1?'s':''));
  renderTop(); if(CUR===p) renderPanel(p);
}

/* ===== Loop ===== */
let last=Date.now();
function tick(){
  const now=Date.now(), dt=((now-last)/1000)*SPEED; last=now;
  const pr=prodPerSec();
  for(const k of ['wood','clay','iron','food']){ S.recursos[k]+= (pr[k]||0)*dt; S.recursos[k]=Math.min(S.recursos[k], storageCap()); }
  updateVillagers(dt);
  renderTop();
  requestAnimationFrame(tick);
}

/* ===== UI Top / Painel Contextual ===== */
function renderTop(){
  const p=prodPerSec(), eff=efeitos();
  qs('#r-wood').textContent=fmt(S.recursos.wood); qs('#r-clay').textContent=fmt(S.recursos.clay);
  qs('#r-iron').textContent=fmt(S.recursos.iron); qs('#r-food').textContent=fmt(S.recursos.food);
  qs('#p-wood').textContent='+'+(p.wood||0).toFixed(2)+'/s'; qs('#p-clay').textContent='+'+(p.clay||0).toFixed(2)+'/s';
  qs('#p-iron').textContent='+'+(p.iron||0).toFixed(2)+'/s'; qs('#p-food').textContent='+'+(p.food||0).toFixed(2)+'/s';
  qs('#pop').textContent=S.villagers.length +'/'+eff.popMax;
  qs('#store').textContent=fmt(eff.capacidade);
}
function attachSpeedUI(){
  const bar=qs('#speedBar');
  bar.addEventListener('click', (e)=>{
    const chip=e.target.closest('.chip'); if(!chip) return;
    bar.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    SPEED=parseInt(chip.dataset.speed,10)||1;
  });
}
let CUR=null;
function setPanel(open){ qs('#panelRight').classList.toggle('show', !!open); qs('#hover-tip').style.display=open?'none':'block'; }
function openPanel(id){ CUR=id; setPanel(true); renderPanel(id); }
function closePanel(){ CUR=null; setPanel(false); }
qs('#btn-close').onclick=closePanel;
qs('#btn-save').onclick=()=>{save(); toast('Salvo!')};
qs('#btn-reset').onclick=()=>{ if(confirm('Apagar save e reiniciar?')){ localStorage.removeItem('vw-tw'); S=deepClone(DEFAULT); init3DSync(); initialVillagers(); layoutHousesVisual(); toast('Save apagado.'); renderTop(); if(CUR) renderPanel(CUR); } };

function panelHeader(id){
  const def=BUILDINGS[id], lvl=nivel(id);
  qs('#panelTitle').textContent=def.nome;
  qs('#panelInfo').textContent='Nível '+lvl+' / Máx: '+def.max + (id!=='hq'?' • Limite HQ: '+S.predios.hq:''); 
}
function costsStrip(cost){ const div=el('div','', 'costs'); div.append(el('span','Custo:')); div.append(el('span','🪵 '+fmt(cost.wood||0))); div.append(el('span','🧱 '+fmt(cost.clay||0))); div.append(el('span','⛓️ '+fmt(cost.iron||0))); div.append(el('span','🥖 '+fmt(cost.food||0))); div.append(el('span','⚡ Instantâneo')); return div; }
function addUpgradeCard(box,id){
  const lvl=nivel(id), def=BUILDINGS[id];
  const card=el('div','', 'card');
  const row=el('div','', 'row');
  row.append(el('div', '<div class="name">'+(lvl===0?'Construir':'Aprimorar')+'</div>'));
  const btn=el('button', (lvl===0?'Construir':'Aprimorar'), 'primary'); btn.dataset.up=id; row.append(btn); card.append(row); card.append(costsStrip(custoPredio(id))); box.append(card);
}
function addProductionInfo(box,id){ const lvl=nivel(id); if(lvl<=0) return; const pr=prodPerSec(); const which=BUILDINGS[id].producao; if(!which) return; const rate=pr[which]; const card=el('div','', 'card'); card.append(el('div','<div class="name">Produção</div><div class="muted">Atual: <b>'+(rate||0).toFixed(2)+'/s</b></div>')); box.append(card); }
function addPopInfo(box){ const eff=efeitos(); const card=el('div','', 'card'); card.append(el('div','<div class="name">População</div><div class="muted">Aldeões: <b>'+S.villagers.length+'</b> • Cap.: <b>'+eff.popMax+'</b></div>')); box.append(card); }
function addTrainGroup(box, types){
  const card=el('div','', 'card'); card.append(el('div','<div class="name">Treinar</div><div class="muted">Requer aldeões livres</div>'));
  types.forEach(id=>{ const u=UNITS[id], pred=u.predio, lvl=nivel(pred), lock=lvl<1, c=u.custo;
    const row=el('div','', 'row'); row.append(el('div','<div><b>'+u.nome+'</b> <span class="badge">'+BUILDINGS[pred].nome+' N'+lvl+'</span></div>'));

function addForestInstanced(){
  const trunkGeo=new THREE.CylinderGeometry(0.45,0.6,3.8,6);
  const leafGeo=new THREE.ConeGeometry(1.9,3.6,9);
  const trunkMat=new THREE.MeshStandardMaterial({color:0x6d4b2a, roughness:0.9});
  const leafMat=new THREE.MeshStandardMaterial({color:0x2b7a3f, roughness:0.7});
  const count=420;
  const trunkInst=new THREE.InstancedMesh(trunkGeo, trunkMat, count);
  const leafInst=new THREE.InstancedMesh(leafGeo, leafMat, count);
  const m4=new THREE.Matrix4();
  for(let i=0;i<count;i++){
    const r=rand(36,MAP_RADIUS-10), ang=rand(0,Math.PI*2);
    const x=Math.cos(ang)*r, z=Math.sin(ang)*r;
    const y=1.9;
    m4.makeTranslation(x,y,z);
    trunkInst.setMatrixAt(i, m4);
    const scale=rand(0.85,1.25);
    m4.makeTranslation(x,y+2.2,z).scale(new THREE.Vector3(scale,scale,scale));
    leafInst.setMatrixAt(i, m4);
  }
  trunkInst.castShadow=true; trunkInst.receiveShadow=true;
  leafInst.castShadow=true; leafInst.receiveShadow=true;
  scene.add(trunkInst); scene.add(leafInst);
}
function addRocksInstanced(){

  const rockMat=new THREE.MeshStandardMaterial({color:0xa8a8a8, roughness:0.9});
  const count=70; const inst=new THREE.InstancedMesh(rockGeo, rockMat, count); const m4=new THREE.Matrix4();

    const r=rand(22,MAP_RADIUS-8), ang=rand(0,Math.PI*2);
    const x=Math.cos(ang)*r, z=Math.sin(ang)*r; const s=rand(0.6,1.8);
    m4.compose(new THREE.Vector3(x,0.8,z), new THREE.Quaternion(), new THREE.Vector3(s,s,s));

}

function placeBuildings(){
  const center=new THREE.Vector3(0,0,0);
  addBuilding('hq', center);
  const ring1=52, ring2=88;
  const order1=['casas','armazem','mercado','ferreiro','quartel','estabulo','oficina','praca'];
  const order2=['bosque','argila','ferro','fazenda'];
  order1.forEach((id,i)=>{
    const a=(i/order1.length)*Math.PI*2 + 0.3;
    const pos=new THREE.Vector3(Math.cos(a)*ring1,0,Math.sin(a)*ring1);
    addBuilding(id,pos);
    addPath(center,pos);
  });
  order2.forEach((id,i)=>{
    const a=(i/order2.length)*Math.PI*2 + 0.15;
    const pos=new THREE.Vector3(Math.cos(a)*ring2,0,Math.sin(a)*ring2);
    addBuilding(id,pos);
    addPath(buildingPos['mercado']||center,pos);
  });
  layoutHousesVisual();
}
function addPath(a,b){
  const len=a.distanceTo(b);
  const geo=new THREE.BoxGeometry(len,0.35,2.6);
  const mat=new THREE.MeshStandardMaterial({color:0xd9c79c, roughness:0.85});
  const m=new THREE.Mesh(geo,mat); m.position.copy(a).add(b).multiplyScalar(0.5); m.position.y=0.18;
  m.rotation.y=Math.atan2(b.x-a.x, b.z-a.z);
  m.castShadow=false; m.receiveShadow=true;
  scene.add(m);
}
function addBuilding(id, pos){
  buildingPos[id]=pos.clone();
  const g=meshPredio(id);
  g.position.copy(pos);
  g.lookAt(0,0,0);
  g.traverse(o=>{o.castShadow=true;o.receiveShadow=true});
  scene.add(g);
  meshes[id]=g;
}
function layoutHousesVisual(){
  houseHuts.forEach(m=>scene.remove(m));
  houseHuts.length=0;
  const lvl=nivel('casas'), pos=buildingPos['casas']; if(!pos) return;
  const n=Math.min(14, Math.max(4, Math.floor(lvl/2)+3));
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const r=10+ (i%2)*3;
    const x=pos.x+Math.cos(a)*r, z=pos.z+Math.sin(a)*r;
    const hut=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.2,2.0), new THREE.MeshStandardMaterial({color:0xcaa06a})); b.position.y=0.9; hut.add(b);
    const rf=roof(1.4,0.7,0xa9642a); rf.position.y=1.6; hut.add(rf);
    hut.position.set(x,0,z);
    scene.add(hut); houseHuts.push(hut);
  }
}
function updateMesh(id){ const g=meshes[id]; if(!g) return; scaleByLevel(g, nivel(id)); }

function animate3D(){ requestAnimationFrame(animate3D); if(!renderer) return; controls.update(); raycaster.setFromCamera(mouse,camera); const hits=raycaster.intersectObjects(Object.values(meshes),true);
  if(hits.length>0){ let p=hits[0].object; while(p && !p.userData.id) p=p.parent; if(p && p.userData.id){ tip.style.display='block'; tip.textContent=BUILDINGS[p.userData.id].nome+' — N '+nivel(p.userData.id)+' (clique)'; } } else { if(!CUR) tip.style.display='block'; }
  const hq=meshes['hq']; if(hq){ hq.traverse(o=>{ if(o.userData && o.userData.flag){ o.rotation.z = Math.sin(performance.now()*0.002)*0.1; } }); }
  renderer.render(scene,camera);

let villagerId=1;
function villagerMesh(color=0x9ec1db){
  const g=new THREE.Group();

  return g;
}
function equipWeapon(g,type){
  g.children = g.children.filter(ch=>{ if(ch.userData && ch.userData.weapon) { g.remove(ch); return false } return true});
  let m=null;
  if(type==='sword'){ m=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.8,0.1), new THREE.MeshStandardMaterial({color:0xc0c0c0, roughness:0.3})); m.position.set(0.35,1.1,0); }
  if(type==='spear'){ m=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.3,6), new THREE.MeshStandardMaterial({color:0x8b5a2b})); const tip=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.25,6), new THREE.MeshStandardMaterial({color:0xc0c0c0})); tip.position.y=0.65; m.add(tip); m.position.set(0.4,1.0,0); }
  if(type==='knight'){ m=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.1), new THREE.MeshStandardMaterial({color:0x606060})); m.position.set(0,1.3,0); }
  if(type==='ram'){ m=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.3), new THREE.MeshStandardMaterial({color:0x7a4a1f})); m.position.set(-0.4,0.9,0); }
  if(type==='cata'){ m=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.2,0.4), new THREE.MeshStandardMaterial({color:0x6c4418})); m.position.set(-0.4,1.0,0); }
  if(m){ m.userData={weapon:true}; g.add(m); }
}
function setVillagerRole(v, role){
  v.role=role;
  const colors={worker:0x9ec1db, sword:0xaa3333, spear:0x2255aa, knight:0x777777, ram:0x8b5a2b, cata:0x6c4418};
  v.mesh.children[0].material.color.setHex(colors[role]||0x9ec1db);
  if(role==='worker') equipWeapon(v.mesh,null); else equipWeapon(v.mesh,role);
}
function spawnVillager(pos, role='worker', assigned=null){
  const mesh=villagerMesh();
  mesh.position.copy(pos.clone().add(new THREE.Vector3(rand(-2,2),0,rand(-2,2))));
  scene.add(mesh);
  const v={id:villagerId++, mesh, role:'worker', assigned, speed:rand(1.4,1.9), target:null, wait:0, bob:rand(0,Math.PI*2)};
  setVillagerRole(v, role||'worker');
  S.villagers.push(v);
  return v;
}
function spawnNewVillagers(q){
  const cap=popCap();
  for(let i=0;i<q;i++){
    if(S.villagers.length>=cap) break;
    const pos=buildingPos['casas']||new THREE.Vector3(0,0,0);
    spawnVillager(pos,'worker', null);
  }
  ensureAssignments();
}
function initialVillagers(){
  if(S.villagers.length===0){
    spawnVillager(buildingPos['hq']||new THREE.Vector3(), 'worker', 'hq');
    spawnVillager(buildingPos['armazem']||new THREE.Vector3(), 'worker', 'armazem');
    spawnVillager(buildingPos['fazenda']||new THREE.Vector3(), 'worker', 'fazenda');
  }
  ensureAssignments();
}
function ensureAssignments(){
  Object.keys(BUILDINGS).forEach(id=>{
    if(nivel(id)>0 && id!=='casas'){
      const already=S.villagers.find(v=>v.assigned===id);
      if(!already){
        const free=S.villagers.find(v=>v.role==='worker' && !v.assigned);
        if(free) free.assigned=id;
      }
    }
  });
}
function randomDestination(v){
  const keys=Object.keys(buildingPos);
  const k=keys[Math.floor(Math.random()*keys.length)];
  const p=buildingPos[k].clone(); p.x+=rand(-6,6); p.z+=rand(-6,6); return p;
}
function updateVillagers(dt){
  const bounds=MAP_RADIUS-6;
  for(const v of S.villagers){
    v.bob+=dt*2; v.mesh.position.y = 0 + Math.sin(v.bob)*0.04;
    if(v.wait>0){ v.wait-=dt; continue; }
    if(!v.target || v.mesh.position.distanceTo(v.target)<1.2){
      v.target=randomDestination(v);
      v.wait=rand(0.2,1.0);
    }
    const dir=v.target.clone().sub(v.mesh.position); dir.y=0; const d=dir.length(); if(d>0.001){ dir.normalize(); v.mesh.position.addScaledVector(dir, v.speed*dt); v.mesh.lookAt(v.mesh.position.clone().add(dir)); }
    const dR=Math.hypot(v.mesh.position.x, v.mesh.position.z);
    if(dR>bounds){ const scl=bounds/dR; v.mesh.position.x*=scl; v.mesh.position.z*=scl; v.target=null; }
  }
}
